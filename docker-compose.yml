services:
  postgres:
    image: postgres:16-alpine
    container_name: sadhox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sadhox
      POSTGRES_PASSWORD: sadhox
      POSTGRES_DB: sadhox
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadhox -d sadhox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sadhox-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
