name: CI

on:
  pull_request:
  push:
    branches: [main, master, Dev-D]

jobs:
  server:
    name: Server lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.6.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (server ESLint)
        run: pnpm --filter server lint

      - name: Typecheck (server)
        run: pnpm --filter server check-types

      - name: Unit tests (server)
        run: pnpm --filter server test
        env:
          DATABASE_URL: postgresql://sadhox:sadhox@127.0.0.1:5432/sadhox
          CORS_ORIGIN: http://localhost:5173
          JWT_ACCESS_SECRET: ci-access-secret-min-16
          JWT_REFRESH_SECRET: ci-refresh-secret-min-16
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          LOG_LEVEL: silent
