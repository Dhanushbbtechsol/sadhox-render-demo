packages:
  - apps/*
  - packages/*
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - why-is-node-running@3.2.2
blockExoticSubdeps: true
allowBuilds:
  "@parcel/watcher": true
  "@scarf/scarf": true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  "@types/node": ^26.2.0
  react: 19.2.8
  "@types/react": ^19.2.18
# Same-major floors for pnpm audit. braces has no patched release.
overrides:
  "handlebars@4.7.9": "4.7.10"
  "tar@7.5.7": "7.5.22"
  "path-to-regexp@6.1.0": "6.3.0"
  "path-to-regexp@8.2.0": "8.4.2"
  "path-to-regexp@8.3.0": "8.4.2"
  "minimatch@10.1.1": "10.2.6"
  "js-yaml@4.1.1": "4.3.2"
  "smol-toml@1.5.2": "1.9.0"
  "source-map-js@1.2.1": "1.2.2"
  "undici@>=5.0.0 <6.28.1": "6.28.1"
  "ajv@8.6.3": "8.20.0"
  "@fastify/busboy@2.1.1": "3.2.2"
  "@modelcontextprotocol/sdk@1.30.0": "1.31.0"
  "@tootallnate/once@2.0.0": "2.0.1"
  "basic-ftp@5.3.1": "6.2.1"
  "esbuild@0.18.20": "0.25.12"
