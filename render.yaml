# Render Blueprint — Sadhox client demo (staging)
# Spec: https://render.com/docs/blueprint-spec
#
# Locked: region=oregon, postgresMajorVersion=16, staging plan=free.
# Production Environment (separate Blueprint / Environment), mirror names:
#   sadhox-api-prod / sadhox-web-prod / sadhox-pg-prod / sadhox-redis-prod
#
# Showcase topology: Vercel SPA + this Blueprint's API/DB/Redis.
# Leave sadhox-web-staging unwired when SPA is on Vercel.
# Apply order (secrets):
#   1. API: RESEND_API_KEY, MAIL_FROM=beth.t@example.com (demo),
#      CORS_ORIGIN=https://placeholder-not-yet-deployed.invalid (never *)
#   2. After Vercel + API URLs exist: Vercel VITE_SERVER_URL + API CORS_ORIGIN
#   3. Migrate + full demo seed — see Docs/Phase/Dev D/render-client-demo-bringup.md

services:
  - type: web
    name: sadhox-api-staging
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # pnpm workspace: install from repo root, build Nest server package only.
    # Render already provides pnpm; corepack enable fails (EROFS on /usr/bin).
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter server build
    # Listen on Render-injected $PORT (do not hardcode PORT in envVars).
    startCommand: pnpm --filter server start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Placeholder at apply; replace with exact Vercel origin (never *).
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: AUTO_CLOSE_CRON
        value: "0 2 * * *"
      - key: AUTO_CLOSE_DAYS
        value: "3"
      - key: DB_POOL_MAX
        value: "10"
      - key: THROTTLE_GLOBAL_LIMIT
        value: "100"
      - key: THROTTLE_GLOBAL_TTL_MS
        value: "60000"
      - key: DATABASE_URL
        fromDatabase:
          name: sadhox-pg-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sadhox-redis-staging
          property: connectionString

  # Optional Render Static Site — unused for Vercel showcase; safe to skip wiring.
  - type: web
    name: sadhox-web-staging
    runtime: static
    rootDir: .
    # Static sites auto-install deps; skip corepack (EROFS). Rebuild web only.
    buildCommand: pnpm --filter web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Only if hosting SPA on Render instead of Vercel.
      - key: VITE_SERVER_URL
        sync: false

  # Redis-compatible Key Value for BullMQ. noeviction recommended for queues.
  # ipAllowList: [] = private network only (web service in same region).
  - type: keyvalue
    name: sadhox-redis-staging
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Internal-only Postgres; Nest connects via private DATABASE_URL.
  - name: sadhox-pg-staging
    plan: free
    region: oregon
    databaseName: sadhox
    user: sadhox
    postgresMajorVersion: "16"
    ipAllowList: []
