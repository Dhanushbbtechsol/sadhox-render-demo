# Render Blueprint — Phase 1 Day 5 staging deploy
# Connect this repo in Render Dashboard → New → Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sadhox-api-staging
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter server build
    startCommand: pnpm --filter server start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sadhox-pg-staging
          property: connectionString

databases:
  - name: sadhox-pg-staging
    plan: free
    databaseName: sadhox
    user: sadhox
